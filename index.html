<style>

<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbxLOVSJsDAM6eVUsrdJ2rMsEZslS2F3guBm6GwyDCJXUn7Nt1-O99pjsT7OyQaWghT7Eg/exec",KEY='exam_done_review_g2';
// اختياري: [تعليمات, نص, الخيارات, رقم الإجابة الصحيحة]
const QA=[
["الكلمة التي تُعرب إعراب الأسماء الخمسة فيما يلي:","الأخُ الصالحُ عَونٌ لأخيه، والفمُ الطيّبُ يمنحُ الكلماتِ ذاتَ النقاءِ من قلبٍ طاهر.",["الأخ","أخيه","الفم","ذات"],1],
["إعراب ما تحته خط:","وينشأُ ناشئُ الفتيانِ منّا ∴ على ما كانَ عوَّدَه <u>أبوه</u>",["اسم (كان) مؤخر مرفوع بالواو","نائب فاعل مرفوع بالواو","فاعل مرفوع بالواو","فاعل مرفوع بالضمة"],2],
["إعراب ما تحته خط:","<u>أبا</u> الهولِ طالَ عليكَ العصرُ ∴ وبُلِّغتَ في الأرضِ أقصى العُمُر",["مفعول به منصوب بالألف","منادى منصوب بالألف","منادى مبني على الألف","مبتدأ مرفوع بالألف"],1],
["الممنوع من الصرف لعلّتين:","",["صغرى","مواقف","صفراء","نيويورك"],3],
["ما يُصرف من الكلمات التالية:","",["يوسف","نوح","إسحاق","عيسى"],1],
["«يتعامل الغربُ مع الآخرين بـ ............». الصيغة الصحيحة لملء الفراغ:","",["مقاييسَ مختلفةً","مقاييسَ مختلفةٍ","مقاييسِ مختلفةٍ","مقاييسِ مختلفةً"],1],
["نوع النعت الحقيقي فيما يلي:","كلُّ بيتٍ أنتَ ساكنُه ∴ غيرُ محتاجٍ إلى السُّرُجِ",["مفرد","جملة اسمية","جملة فعلية","شبه جملة"],1],
["جملة النعت وموقعها الإعرابي فيما يلي:","«إنَّ أمةً دبَّتْ فيها روحُ الوطنية، وطمحتْ نفسُها للتغيير لا تموتُ أبدًا».",["دبّت فيها روح الوطنية – رفع","لا تموت أبدًا – جر","لا تموت أبدًا – نصب","دبّت فيها روح الوطنية – نصب"],3],
["ميّز الجملة التي ورد فيها لفظ «غير» نعتًا:","",["رأيتُكَ غيرَ مهتمٍّ بالقضية.","أنتَ غيرُ مهتمٍّ بالقضية.","أصبحتَ غيرَ مهتمٍّ بالقضية.","تلك قضيةٌ غيرُ مهتمٍّ بها."],3],
["نوع البدل في الجملتين على الترتيب:","«أحبُّ الإسكندريةَ معالمَها» – «أحبُّ الإسكندريةَ منظرَها».",["بعض من كل، بعض من كل","بعض من كل، اشتمال","مطابق، بعض من كل","اشتمال، بعض من كل"],1],
["«قرأتُ الكتابَ ............». البدل المناسب لملء الفراغ:","",["كلَّه","ذاتَه","معظمَه","عينَه"],2],
["إعراب ما تحته خط على الترتيب:","«بهرني المصريون <u>حضارتُهم</u>» – «المصريون <u>حضارتُهم</u> عريقةٌ».",["مفعول به منصوب، بدل مرفوع","بدل مرفوع، خبر مرفوع","بدل مرفوع، مبتدأ ثانٍ مرفوع","مفعول به منصوب، مبتدأ ثانٍ مرفوع"],2],
["«سأسافرُ بالسيارةِ بل القطارِ». أداة العطف (بل) أفادت:","",["الإضراب","إثبات الحكم لما قبله","الاستدراك","نفي الحكم عمّا بعده"],0],
["«لا أُقدِّرُ الجهلَ لكنِ العلمَ» – «الجهلُ ظلامٌ لكنَّ العلمَ نورٌ». إعراب (العلم) على الترتيب:","",["معطوف منصوب، معطوف مرفوع","اسم «لكنّ» منصوب، معطوف مرفوع","معطوف منصوب، اسم «لكنّ» منصوب","اسم «لكنّ» منصوب، معطوف منصوب"],2],
["«مسلمو مصرَ ومسيحيّوها يعملون من أجل نهضتِها». علامة رفع المعطوف:","",["الضمة الظاهرة","الضمة المقدرة","الواو","ثبوت النون"],2]
];
// مقالي: [تعليمات, نص, الإجابة النموذجية, مجموعات كلمات التصحيح, الحد الأدنى]
const EA=[
["حدّد المنعوت والنعت في العبارتين الآتيتين، ثم بيّن نوع النعت (حقيقي أم سببي):","(١) الحريةُ الفكريةُ أساسُ نهضةِ الأمم.<br>(٢) يطمئنُّ الإنسانُ في مجتمعٍ عادلةٍ قوانينُه.","(١) المنعوت: الحرية، والنعت: الفكرية — نعت حقيقي.<br>(٢) المنعوت: مجتمع، والنعت: عادلة — نعت سببي (لأنه رفع الاسم الظاهر بعده «قوانينه»).",[["حقيق"],["سبب"],["فكري"],["عادل"]]],
["أعدْ صياغة الجملة التالية بحيث تشتمل على بدل، وبيّن نوعه:","سرتُ نصفَ الطريق.","سرتُ الطريقَ نصفَه — «نصفَه» بدل بعض من كل.",[["الطريق"],["نصفه"],["بعض"]]],
["استخرج من البيت التالي ممنوعين من الصرف، مبينًا سبب المنع:","وتهزُّني ذكرى المروءةِ والندى ∴ بينَ الشمائلِ هِزَّةَ المشتاقِ","ذكرى: ممنوعة من الصرف لألف التأنيث المقصورة.<br>الشمائل: ممنوعة من الصرف لصيغة منتهى الجموع.",[["ذكرى"],["مقصور"],["شمائل"],["منتهى"]]],
["أعرب ما تحته خط:","(١) «أصادقُ <u>ذا</u> الخلقِ الكريم».<br>(٢) «اعتنِ بنظافةِ <u>فيكَ</u>».","(١) ذا: مفعول به منصوب وعلامة نصبه الألف (لأنه من الأسماء الخمسة).<br>(٢) فيك: مضاف إليه مجرور وعلامة جره الياء (لأنه من الأسماء الخمسة).",[["مفعول"],["الالف"],["مضاف اليه"],["الياء"]]],
["السؤال الأخير (أسئلة عامة على الدروس): اقرأ الفقرة ثم أجب عن المطلوب.",
"«من الضروري أن تُسَنَّ <u>قوانينُ</u> تحمي الملكيةَ الفكريةَ للعلماء والباحثين، وذلك بعد أن انتشرت السَّرِقاتُ العلميةُ بين الباحثين بعضُهم مِنَ <u>الَّذين</u> ساءت أخلاقُهم وفسدت ضمائرُهم، ولا قيمةَ لعلمٍ مبنيةٍ بحوثُه على الزَّيفِ لا الحقيقةِ، وأحرى بذي العلمِ أن يكونَ ذا خُلُقٍ <u>ودينٍ</u>».<br><b>(أ)</b> أعرب ما تحته خط.<br><b>(ب)</b> استخرج من الفقرة: (١) اسمين من الأسماء الخمسة، وأعربهما. (٢) نعتًا حقيقيًّا مرفوعًا، وآخر منصوبًا. (٣) نعتًا جملة، واذكر محلها الإعرابي. (٤) نعتًا سببيًّا، واضبط ما بعده. (٥) بدلًا، واذكر نوعه. (٦) معطوفًا يخالف معطوفه، واذكر علامة إعرابه. (٧) ممنوعين من الصرف لسببين مختلفين، واذكرهما.<br><b>(ج)</b> «يجب أن نحمي الملكيةَ الفكريةَ للعلماءِ والباحثين». اجعل ما تحته خط (العلماء) — في الجملة السابقة — معربًا بعلامة فرعية، وغيّر ما يلزم.<br><b>(د)</b> يقول الزيات: «ما كان الفضلُ يومًا بالمال لكن العلم». ما الذي أفاده العطف بـ(لكن) في الجملة السابقة؟<br><b>(هـ)</b> «رأيتُكم ذوي حرصٍ على مساعدةِ إخوانِكم». اجعل ما تحته خط (ذوي حرص – إخوانكم) — في الجملة السابقة — مفردًا، وغيّر ما يلزم.<br><b>(و)</b> (١) أي الجمل الآتية لم تشتمل على بدل: أ) أعجبني في مصرَ جنودُها البواسل. ب) أعجبني البواسلُ جنودُ مصر. ج) أعجبني بواسلُ مصرَ جنودُها. د) أعجبتني مصرُ جنودُها البواسل.<br>(٢) يا ذا الذي بعذابي ظلَّ مفتخرًا ∴ هلْ أنتَ إلّا مليكٌ جارَ إذْ قدرا — ميّز المحل الإعرابي للاسم الموصول في الشطر الأول: أ) جر مضاف إليه ب) نصب بدل ج) رفع نعت د) رفع خبر.<br><b>(ز)</b> «كان سيدُنا يوسفُ على خزائنِ الأرضِ في مصر». اجعل كلمة (خزائن) — في الجملة السابقة — مجرورة بالفتحة، وغيّر ما يلزم.",
"<b>(أ)</b> قوانينُ: نائب فاعل مرفوع وعلامة رفعه الضمة. الذين: اسم موصول مبني في محل جر بـ«من». ودينٍ: معطوف على «خلق» مجرور وعلامة جره الكسرة.<br><b>(ب)</b> (١) ذي (بذي العلم): اسم مجرور بالباء وعلامة جره الياء — ذا (يكون ذا خلق): خبر «يكون» منصوب وعلامة نصبه الألف. (٢) حقيقي مرفوع: العلمية — حقيقي منصوب: الفكرية. (٣) «تحمي الملكية الفكرية»: جملة فعلية في محل رفع نعت لـ«قوانين». (٤) «مبنيةٍ بحوثُه»: نعت سببي، و«بحوثُه» نائب فاعل مرفوع بالضمة. (٥) «بعضُهم»: بدل بعض من كل من «الباحثين». (٦) «الحقيقةِ»: معطوف بـ«لا» على «الزيف» مجرور بالكسرة، وهو يخالف معطوفه في الحكم (ينفيه عنه). (٧) قوانين: صيغة منتهى الجموع — أحرى: الوصفية ووزن الفعل.<br><b>(ج)</b> يجب أن نحمي الملكية الفكرية للعالِمين والباحثين.<br><b>(د)</b> الاستدراك.<br><b>(هـ)</b> رأيتُك ذا حرصٍ على مساعدة أخيك.<br><b>(و)</b> (١) أ (أعجبني في مصرَ جنودُها البواسل). (٢) ج (رفع نعت).<br><b>(ز)</b> كان سيدُنا يوسفُ على خزائنَ في مصر.",
[["نائب فاعل"],["موصول"],["معطوف"],["=ذي"],["=ذا"],["العلميه"],["الفكريه"],["تحمي"],["مبنيه"],["بحوثه"],["بعضهم"],["بعض من كل"],["الحقيقه"],["قوانين","ضمائر"],["احرى"],["عالمين"],["استدراك"],["اخيك"],["في مصر"],["نعت"],["خزائن"]],12]
];
const QB=[
["حدّد الجملة التي تُعدّ تعبيرًا مجازيًّا:","",["تشرقُ الشمسُ كلَّ يومٍ فتنيرُ الأرضَ ضياءً.","تطلُّ التحدياتُ برأسِها في طريق النجاح.","تمتلئُ المكتباتُ العربيةُ بأصولِ الكتب.","يحرصُ المصلحون على الدعوةِ إلى العملِ الجادّ."],1],
["حدّد الجملة التي تُعدّ تعبيرًا حقيقيًّا:","",["بكتِ السماءُ شتاءً فارتوتِ الأرضُ.","تُسابقُ الدولُ الزمنَ لامتلاكِ التكنولوجيا.","حقّقَ العلمُ قفزاتٍ هائلةً في علاجِ الأمراضِ.","اعتلى الفارسُ صهوةَ جوادِه وانطلقَ بهِ."],3],
["حدّد الجملة التي تعبّر مجازيًّا عن المعنى المقصود:","«أثرُ الكلمةِ الطيبةِ في القلوب».",["يسعدُ الناسُ بسماعِ الكلامِ الحسنِ والثناء.","الكلمةُ الطيبةُ غرسٌ يثمرُ في سويداءِ القلوب.","يجبُ على الإنسانِ أن يختارَ كلماتِه بعناية.","القلوبُ تميلُ إلى من يتحدثُ إليها بصدق."],1],
["إذا جعلنا كلمة «عين» مجازًا مرسلًا في جملة؛ تصبح العبارة الصحيحة:","",["أصابَ عينيَ الرمدُ.","أغمضَ الطفلُ عينَه.","أرسلَ القائدُ عينَه.","تأمّلتُ بعيني في السماء."],2],

const EB=[
["قال تعالى: ﴿وَمِنْهُمُ الَّذِينَ يُؤْذُونَ النَّبِيَّ وَيَقُولُونَ هُوَ <u>أُذُنٌ</u> قُلْ أُذُنُ خَيْرٍ لَكُمْ﴾ [التوبة: ٦١].","حدّد المجاز المرسل وعلاقته في الآية الكريمة.","«أُذُن»: مجاز مرسل علاقته الجزئية (ذُكر الجزء «الأذن» وأُريد الكل وهو الرجل الذي يسمع كل ما يُقال).",[["جزئ"]]],
["قال ناجي: وضحِكنا ضحكَ طفلَينِ معًا ∴ وعَدَونا فسبقْنا ظلَّنا","حدّد المشبَّه والمشبَّه به ونوع التشبيه على الترتيب.","المشبَّه: ضحِكنا. المشبَّه به: ضحك طفلين. النوع: تشبيه بليغ (حُذفت الأداة ووجه الشبه).",[["ضحك"],["طفلين"],["بليغ"]]],
["قال تعالى: ﴿وَأُحِيطَ بِثَمَرِهِ فَأَصْبَحَ <u>يُقَلِّبُ كَفَّيْهِ</u> عَلَىٰ مَا أَنفَقَ فِيهَا﴾ [الكهف: ٤٢].","ميّز اللون البياني فيما تحته خط.","«يقلّب كفيه»: كناية عن صفة وهي الندم.",[["كناي"],["ندم"]]],
["قال الشاعر: شاورْ سواكَ إذا نابتكَ نائبةٌ ∴ يومًا وإنْ كنتَ من أهلِ المشوراتِ","ميّز الأسلوب الإنشائي في البيت السابق، مبينًا غرضه.","الأسلوب: أمر (شاورْ). غرضه البلاغي: النصح والإرشاد.",[["امر"],["نصح","ارشاد"]]],
["قال زهير بن أبي سلمى: ومن يجعلِ المعروفَ في غيرِ أهلِهِ ∴ يكنْ حمدُه ذمًّا عليه ويندمِ","ميّز نوع المحسّن البديعي في قوله: «يكنْ حمدُه ذمًّا عليه».","طباق (بين «حمده» و«ذمًّا»).",[["طباق"]]]

const ALL=[...QA.map(x=>({t:0,x,h:'النحو — الأسئلة الاختيارية',d:'اختر الإجابة الصحيحة لكل سؤال.'})),...EA.map(x=>({t:1,x,h:'النحو — الأسئلة المقالية',d:'اكتب إجابتك بأسلوبك، والتصحيح تقريبي.'})),...QB.map(x=>({t:0,x,h:'البلاغة — الأسئلة الاختيارية',d:'اختر الإجابة الصحيحة لكل سؤال.'})),...EB.map(x=>({t:1,x,h:'البلاغة — الأسئلة المقالية',d:'اكتب إجابتك بأسلوبك، والتصحيح تقريبي.'}))];
const $=s=>document.querySelector(s),N=n=>n.toLocaleString('ar-EG'),L=['أ','ب','ج','د'],esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\u0621-\u064Aa-z0-9\s]/gi,' ').replace(/\s+/g,' ').trim();
const pick={},ev={};let name='',warned=false;
// تصحيح تقريبي للمقالي: يكفي أن يذكر الطالب كلمة من كل مجموعة ("=" تعني الكلمة بالضبط)
function gr(i){const x=ALL[i].x,g=x[3],t=norm(ev[i]),w=t.split(' ');
 const c=g.filter(a=>a.some(k=>k[0]=='='?w.some(y=>y==norm(k.slice(1))||y=='و'+norm(k.slice(1))):t.includes(norm(k)))).length;return c>=(x[4]||g.length)}
function show(id){['s','x','r'].forEach(k=>$('#'+k).hidden=k!=id);scrollTo(0,0)}
function qh(i,m){
 const it=ALL[i],x=it.x,e=it.t,g=m&&(e?gr(i):pick[i]===x[3]);
 let s=`<article class="q${g?' g':''}"><span class="n">${N(i+1)}</span><div>${x[0]?`<p class="p">${x[0]}</p>`:''}${x[1]?`<p class="t">${x[1]}</p>`:''}`;
 if(!e)s+='<div class="os">'+x[2].map((o,k)=>`<label class="o${m&&k==x[3]?' ok':m&&k===pick[i]?' no':''}"><input type="radio" name="r${i}" value="${k}"${k===pick[i]?' checked':''}${m?' disabled':''}><b>${L[k]}</b><span>${o}</span></label>`).join('')+'</div>';
 else s+=m?`<div class="ans"><p><b>${g?'✓ احتُسبت إجابتك صحيحة':'✗ لم تُحتسب إجابتك'}</b></p><small>إجابتك</small><p>${esc(ev[i]||'—').replace(/\n/g,'<br>')}</p><small>الإجابة النموذجية</small><p>${x[2]}</p></div>`:`<textarea id="e${i}" rows="${x[3].length>10?14:3}" placeholder="اكتب إجابتك هنا…"></textarea>`;
 return s+'</div></article>';
}
function all(m){let h='',p='';ALL.forEach((it,i)=>{if(it.h!=p){p=it.h;h+=`<h2>${p}</h2><p>${it.d}</p>`}h+=qh(i,m)});return h}
function prog(){const t=ALL.length;let d=Object.keys(pick).length;document.querySelectorAll('textarea').forEach(a=>{if(a.value.trim())d++});
 $('#pc').textContent=N(d)+' / '+N(t);$('#pr').style.width=(d/t*100)+'%'}
function start(){const v=$('#nm').value.trim();if(!v){$('#er').hidden=false;$('#nm').focus();return}
 try{if(localStorage.getItem(KEY)){$('#er').textContent='تم تسليم هذا الامتحان من هذا الجهاز من قبل.';$('#er').hidden=false;return}}catch(e){}
 name=v;$('#who').textContent='الطالب: '+name;$('#ex').innerHTML=all(0);show('x');prog()}
$('#go').onclick=start;$('#nm').onkeydown=e=>{if(e.key=='Enter')start()};
$('#ex').addEventListener('change',e=>{if(e.target.type=='radio'){pick[+e.target.name.slice(1)]=+e.target.value;warned=false;$('#wn').hidden=true;prog()}});
$('#ex').addEventListener('input',e=>{if(e.target.tagName=='TEXTAREA')prog()});
$('#sub').onclick=()=>{const nm=ALL.filter(a=>!a.t).length,miss=nm-Object.keys(pick).length;
 if(miss&&!warned){warned=true;$('#wn').textContent=`لم تجب عن ${N(miss)} سؤالًا اختياريًا. اضغط مرة أخرى للتسليم أو أكمل إجاباتك.`;$('#wn').hidden=false;return}
 document.querySelectorAll('textarea').forEach(a=>ev[+a.id.slice(1)]=a.value.trim());
 let mc=0,es=0,nM=0,nE=0;ALL.forEach((a,i)=>{if(a.t){nE++;if(gr(i))es++}else{nM++;if(pick[i]===a.x[3])mc++}});
 const sc=mc+es,T=ALL.length,pc=Math.round(sc/T*100),g=pc>=90?'ممتاز':pc>=80?'جيد جدًا':pc>=65?'جيد':pc>=50?'مقبول':'يحتاج إلى مراجعة';
 $('#rb').innerHTML=`<div class="res"><p class="mu">${esc(name)}</p><div class="big">${N(sc)}<small> / ${N(T)}</small></div><p><b>${N(pc)}٪</b> · ${g}</p><p class="mu">الاختياري: ${N(mc)} / ${N(nM)} · المقالي: ${N(es)} / ${N(nE)}<br>تصحيح المقالي تقريبي، والمعلم يراجع إجابتك.</p><p class="mu" id="st"></p><label class="mu"><input type="checkbox" id="fl"> عرض الأسئلة الخاطئة والمتروكة فقط</label></div><div id="rv">${all(1)}</div>`;
 $('#fl').onchange=e=>$('#rv').classList.toggle('hide',e.target.checked);show('r');
 try{localStorage.setItem(KEY,'1')}catch(e){}
 if(ENDPOINT){const st=$('#st'),f=()=>st.textContent='تعذّر إرسال النتيجة؛ التقط صورة لهذه الشاشة وأرسلها للمعلم.';st.textContent='جارٍ إرسال نتيجتك…';
  try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({name:name+' (ثاني ثانوي)',score:sc,total:T,percent:pc,essays:ALL.map((a,i)=>a.t?(ev[i]||''):null).filter(v=>v!==null).join(' || '),time:new Date().toISOString()})}).then(()=>st.textContent='تم إرسال نتيجتك إلى المعلم ✓').catch(f)}catch(e){f()}}};
</script>
